name: Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller packaging/audiotranslator.spec --noconfirm

      - name: Self-test the built app (decode + Whisper tiny + WebView2 bridge)
        shell: pwsh
        env:
          AUDIOTRANSLATOR_HOME: ${{ runner.temp }}\audiotranslator-home
        run: |
          $proc = Start-Process -FilePath "dist\AudioTranslator\AudioTranslator.exe" `
            -ArgumentList "--self-test", "tests\data\jfk.mp3", "--report", "selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($proc.ExitCode -ne 0) { throw "Self-test failed with exit code $($proc.ExitCode)" }

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/audiotranslator/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist\AudioTranslator\
          Compress-Archive -Path dist\AudioTranslator -DestinationPath "dist\AudioTranslator-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: AudioTranslator-${{ steps.version.outputs.version }}-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {if (on) exit} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/*
