name: Feature request / Предложение
description: Suggest an idea for AudioTranslator
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / Какую задачу хотите решить?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help? / Как приложение могло бы помочь?
