<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioTranslator</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

      <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" /></symbol>
      <symbol id="i-square" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>

      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>

      <symbol id="i-circle-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>

      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></symbol>

      <symbol id="i-languages" viewBox="0 0 24 24"><path d="m5 8 6 6" /><path d="m4 14 6-6 2-3" /><path d="M2 5h12" /><path d="M7 2h1" /><path d="m22 22-5-10-5 10" /><path d="M14 18h6" /></symbol>
    </defs>
  </svg>

  <div class="app" id="app" data-view="empty">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#FFB547"/>
          <g fill="#261802">
            <rect x="6.4" y="12" width="2.8" height="8" rx="1.4"/>
            <rect x="10.8" y="7.5" width="2.8" height="17" rx="1.4"/>
            <rect x="15.2" y="10.5" width="2.8" height="11" rx="1.4"/>
            <rect x="20" y="11.8" width="6" height="2.8" rx="1.4"/>
            <rect x="20" y="17.4" width="4" height="2.8" rx="1.4"/>
          </g>
        </svg>
        <span data-i18n="app.name">AudioTranslator</span>
      </div>
      <div class="topbar-actions">
        <button class="ghost-btn" id="btn-settings" type="button">
          <svg class="i"><use href="#i-settings-2"/></svg>
          <span data-i18n="top.settings">Settings</span>
        </button>
      </div>
    </header>

    <main class="workspace">
      <aside class="queue" id="queue" aria-labelledby="queue-title">
        <div class="queue-head">
          <h2 id="queue-title" data-i18n="queue.title">Queue</h2>
          <div class="queue-add">
            <button class="icon-btn" id="btn-add-files" type="button" data-i18n-title="queue.addFiles">
              <svg class="i"><use href="#i-plus"/></svg>
            </button>
            <button class="icon-btn" id="btn-add-folder" type="button" data-i18n-title="queue.addFolder">
              <svg class="i"><use href="#i-folder-open"/></svg>
            </button>
          </div>
        </div>
        <ol class="queue-list" id="queue-list" role="listbox" aria-labelledby="queue-title"></ol>
        <div class="queue-foot">
          <span class="num" id="queue-summary"></span>
          <button class="link-btn" id="btn-clear" type="button" data-i18n="queue.clear">Clear</button>
        </div>
      </aside>

      <section class="stage" id="stage">
        <div class="empty" id="empty">
          <svg class="empty-wave" id="empty-wave" aria-hidden="true"></svg>
          <h1 data-i18n="empty.title">Drop audio or video here</h1>
          <p data-i18n="empty.text"></p>
          <div class="empty-actions">
            <button class="btn btn-primary" id="btn-empty-files" type="button">
              <svg class="i"><use href="#i-file-audio"/></svg>
              <span data-i18n="empty.files">Choose files</span>
            </button>
            <button class="btn" id="btn-empty-folder" type="button">
              <svg class="i"><use href="#i-folder-open"/></svg>
              <span data-i18n="empty.folder">Choose folder</span>
            </button>
          </div>
        </div>

        <div class="file-view" id="file-view" hidden>
          <header class="file-head">
            <div class="file-title">
              <h1 id="fv-name"></h1>
              <div class="file-meta num" id="fv-meta"></div>
            </div>
            <div class="file-actions" id="fv-actions"></div>
          </header>
          <div class="wave-wrap" id="wave-wrap">
            <canvas id="wave"></canvas>
            <div class="wave-times num"><span>0:00</span><span id="wave-end"></span></div>
          </div>
          <div class="notice" id="fv-notice" hidden></div>
          <div class="lanes" id="lanes">
            <div class="lanes-head" id="lanes-head"></div>
            <div class="lanes-body selectable" id="lanes-body"></div>
          </div>
          <div class="outputs" id="fv-outputs" hidden></div>
        </div>
      </section>
    </main>

    <footer class="deck" id="deck">
      <div class="deck-progress"><i id="deck-bar"></i></div>
      <div class="deck-langs">
        <button class="select-btn" id="sel-source" type="button" aria-haspopup="listbox"></button>
        <svg class="i deck-arrow" aria-hidden="true"><use href="#i-arrow-right"/></svg>
        <button class="select-btn" id="sel-target" type="button" aria-haspopup="listbox"></button>
      </div>
      <div class="deck-divider"></div>
      <div class="deck-config">
        <button class="select-btn" id="sel-model" type="button" aria-haspopup="listbox"></button>
        <div class="deck-formats" id="deck-formats" role="group"></div>
        <button class="deck-output" id="deck-output" type="button">
          <svg class="i i-sm"><use href="#i-folder"/></svg><span id="deck-output-text"></span>
        </button>
      </div>
      <div class="deck-status" id="deck-status" aria-live="polite">
        <strong id="deck-status-main"></strong>
        <span class="num" id="deck-status-sub"></span>
      </div>
      <div class="deck-spacer"></div>
      <button class="btn btn-primary" id="btn-start" type="button">
        <svg class="i"><use href="#i-play"/></svg><span id="btn-start-text"></span>
      </button>
    </footer>
  </div>

  <div id="settings-root"></div>
  <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
    <div class="drop-frame"></div>
    <p data-i18n="drop.release">Release to add files</p>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
