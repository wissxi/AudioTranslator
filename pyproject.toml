[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotranslator"
dynamic = ["version"]
description = "Desktop app that turns speech in audio and video files into text, subtitles and translations — locally, with Whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wissxi" }]
requires-python = ">=3.10"
keywords = ["whisper", "speech-to-text", "transcription", "translation", "subtitles", "srt", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "faster-whisper>=1.1",
    "av>=12",
    "numpy>=1.24",
    "requests>=2.31",
    "deep-translator>=1.11",
    "pywebview>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.urls]
Homepage = "https://github.com/wissxi/AudioTranslator"
Issues = "https://github.com/wissxi/AudioTranslator/issues"
Releases = "https://github.com/wissxi/AudioTranslator/releases"

[project.scripts]
audiotranslator-cli = "audiotranslator.cli:main"

[project.gui-scripts]
audiotranslator = "audiotranslator.app:main"

[tool.setuptools.dynamic]
version = { attr = "audiotranslator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audiotranslator = ["web/**/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
